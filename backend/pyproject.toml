[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "mongo_integration: requires TEST_MONGODB_URI and uses a disposable real MongoDB database",
    "trained_model_integration: loads the private packaged text and audio models on CPU",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "B008"]
